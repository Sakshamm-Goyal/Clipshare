name: Android APK

on:
  push:
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # has Android SDK + accepted licenses preinstalled
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # gradle-wrapper.jar is gitignored, so install Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      # Fixed debug key (committed, public "android" password) so each new APK
      # installs over the previous one instead of failing on a signature mismatch.
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: gradle assembleDebug testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clipshare-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
