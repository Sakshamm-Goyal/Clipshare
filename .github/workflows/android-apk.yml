name: Android APK

on:
  push:
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # has Android SDK + accepted licenses preinstalled
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clipshare-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
